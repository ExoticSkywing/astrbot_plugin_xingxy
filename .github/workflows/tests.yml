name: Plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated plugin tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate configuration schema JSON
        run: python -m json.tool _conf_schema.json > /dev/null
